<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#2B2D2F" />
  <rect x="30" y="30" width="540" height="540" fill="none" stroke="#44474B" stroke-width="1.5" />
  <rect x="40" y="40" width="520" height="520" fill="none" stroke="#222426" stroke-width="1" />
  <!-- CBS Masterworks Banner -->
  <rect x="40" y="40" width="520" height="54" fill="#1C1E20" />
  <text x="60" y="73" font-family="'Josefin Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#D4AF37">CBS MASTERWORKS</text>
  <text x="530" y="73" font-family="monospace" font-size="12" letter-spacing="2" fill="#8E9298" text-anchor="end">DIGITAL · D37779</text>
  <!-- Architectural Gold Linework -->
  <g transform="translate(60, 140)">
    <line x1="0" y1="0" x2="480" y2="0" stroke="#D4AF37" stroke-width="1.2" opacity="0.6" />
    <text x="0" y="55" font-family="'Josefin Sans', sans-serif" font-size="34" font-weight="700" letter-spacing="5" fill="#FAF7F0">J.S. BACH</text>
    <text x="0" y="105" font-family="'Montserrat', sans-serif" font-size="28" font-weight="300" letter-spacing="3" fill="#E2DDD5">The Goldberg Variations</text>
    <text x="0" y="145" font-family="'Montserrat', sans-serif" font-size="18" font-weight="400" font-style="italic" letter-spacing="2" fill="#D4AF37">Glenn Gould, Piano</text>
    <line x1="0" y1="180" x2="480" y2="180" stroke="#D4AF37" stroke-width="1.2" opacity="0.6" />
  </g>
  <!-- Abstract Keyboard/Canon geometric motif -->
  <g transform="translate(60, 370)" opacity="0.45">
    <rect x="0" y="0" width="48" height="120" fill="#FAF7F0" />
    <rect x="52" y="0" width="48" height="120" fill="#FAF7F0" />
    <rect x="104" y="0" width="48" height="120" fill="#FAF7F0" />
    <rect x="156" y="0" width="48" height="120" fill="#FAF7F0" />
    <rect x="208" y="0" width="48" height="120" fill="#FAF7F0" />
    <rect x="36" y="0" width="30" height="74" fill="#18191B" />
    <rect x="88" y="0" width="30" height="74" fill="#18191B" />
    <circle cx="360" cy="60" r="50" fill="none" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="360" cy="60" r="30" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4,4" />
  </g>
  <text x="60" y="535" font-family="monospace" font-size="11" letter-spacing="2" fill="#787C82">1981 STUDIO RECORDING · 33⅓ RPM · AUDIOPHILE PRESSING</text>
