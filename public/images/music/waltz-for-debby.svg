<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#1B2620" />
  <!-- Warm Amber Glow -->
  <radialGradient id="amberGlow" cx="70%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#3D503F" />
    <stop offset="100%" stop-color="#141D18" />
  </radialGradient>
  <rect width="600" height="600" fill="url(#amberGlow)" />
  <rect x="30" y="30" width="540" height="540" fill="none" stroke="#2F4237" stroke-width="1" />
  <!-- Riverside Header -->
  <text x="60" y="85" font-family="'Josefin Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#D8A55A">RIVERSIDE · RLP 399</text>
  <text x="540" y="85" font-family="monospace" font-size="11" letter-spacing="2" fill="#88A291" text-anchor="end">STEREO 33⅓</text>
  <!-- Main Title -->
  <text x="60" y="240" font-family="'Josefin Sans', sans-serif" font-size="38" font-weight="700" letter-spacing="4" fill="#FAF5EB">WALTZ FOR DEBBY</text>
  <text x="60" y="285" font-family="'Montserrat', sans-serif" font-size="22" font-weight="400" letter-spacing="3" fill="#D8A55A">BILL EVANS TRIO</text>
  <!-- Personnel Credits -->
  <g transform="translate(60, 340)">
    <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="13" font-weight="300" letter-spacing="2" fill="#A8BEAF">Scott LaFaro, Bass</text>
    <text x="0" y="24" font-family="'Montserrat', sans-serif" font-size="13" font-weight="300" letter-spacing="2" fill="#A8BEAF">Paul Motian, Drums</text>
    <text x="0" y="48" font-family="'Montserrat', sans-serif" font-size="13" font-weight="300" letter-spacing="2" fill="#A8BEAF">Bill Evans, Piano</text>
  </g>
  <!-- Village Vanguard Live Stamp -->
  <g transform="translate(60, 450)">
    <rect x="0" y="0" width="220" height="32" fill="none" stroke="#D8A55A" stroke-width="1" />
    <text x="110" y="21" font-family="monospace" font-size="10.5" letter-spacing="2.5" fill="#D8A55A" text-anchor="middle">LIVE AT VILLAGE VANGUARD</text>
  </g>
  <text x="60" y="535" font-family="monospace" font-size="11" letter-spacing="2" fill="#6A8574">SUNDAY JUNE 25, 1961 · NEW YORK CITY</text>
</svg>